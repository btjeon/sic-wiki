# ===========================================================
# SiC Semiconductor Wiki - MkDocs configuration
# Author: Byoungtak Jeon
# ===========================================================

site_name: SiC Semiconductor Wiki
site_description: SiC (Silicon Carbide) semiconductor device, process, FDC, and AI applications knowledge base
site_author: Byoungtak Jeon
site_url: https://btjeon.github.io/sic-wiki/

# GitHub 저장소 — 실제 repo 주소로 변경
repo_name: btjeon/sic-wiki
repo_url: https://github.com/btjeon/sic-wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Byoungtak Jeon

# -----------------------------------------------------------
# 테마: Material for MkDocs
# -----------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.instant         # SPA-style page transitions
    - navigation.tracking        # URL auto-update
    - navigation.tabs            # top tabs
    - navigation.tabs.sticky
    - navigation.sections        # left section grouping
    - navigation.expand          # expand left menu
    - navigation.indexes         # section index.md support
    - navigation.top             # back-to-top button
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy          # code copy button
    - content.code.annotate      # code annotations
    - content.tabs.link
    - content.action.edit        # GitHub edit button
    - toc.follow
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# -----------------------------------------------------------
# 추가 CSS / JS
# -----------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

# -----------------------------------------------------------
# Markdown 확장
# -----------------------------------------------------------
markdown_extensions:
  # 기본 확장
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4

  # PyMdown 확장 (Material 권장)
  - pymdownx.arithmatex:           # LaTeX 수식
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

  # PlantUML (회로도/시퀀스 다이어그램)
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg

# -----------------------------------------------------------
# 플러그인
# -----------------------------------------------------------
plugins:
  - search:
      lang:
        - en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true   # use build date when not a git repo
  - awesome-pages

# -----------------------------------------------------------
# Left navigation
# -----------------------------------------------------------
nav:
  - Home: index.md
  - About: about.md

  - Part I. SiC Foundations:
      - Overview: 01-foundations/index.md
      - Ch.1 SiC Material & Crystal Fundamentals: 01-foundations/ch01-material.md
      - Ch.2 SiC Wafer & Epitaxial Growth: 01-foundations/ch02-wafer-epi.md
      - Ch.3 SiC Device Structures: 01-foundations/ch03-device.md

  - Part II. Process & Manufacturing:
      - Overview: 02-process/index.md
      - Ch.4 SiC Process Flow (FEOL → BEOL): 02-process/ch04-process-flow.md
      - Ch.5 onsemi SiC Business · Products · BK Factory: 02-process/ch05-onsemi-bk.md
      - Ch.6 Vertical Supply Chain & EV Strategy: 02-process/ch06-vertical-integration.md

  - Part III. SiC Defect Management:
      - Overview: 03-defect/index.md
      - A. Understanding Defects:
          - A-1 Defect Classification: 03-defect/a01-classification.md
          - A-2 SiC Surface Defects: 03-defect/a02-surface.md
          - A-3 Trench & Sub-CD Micro Defects: 03-defect/a03-trench-subcd.md
          - A-4 Killer / Slow-Killer RCA: 03-defect/a04-killer-rca.md
      - B. Inspection Equipment · AI · Operations:
          - B-5 AOI Equipment Operations: 03-defect/b05-aoi.md
          - B-6 ADC (Auto Defect Classification): 03-defect/b06-adc.md
          - B-7 Klarity Operations: 03-defect/b07-klarity.md
      - C. Control Systems · Quality:
          - C-8 SPC-based Defect Density Mgmt: 03-defect/c08-spc.md
          - C-9 VOG (Visual Outgoing Inspection): 03-defect/c09-vog.md
          - C-10 New Process Introduction: 03-defect/c10-new-process.md
      - D. Reliability White Paper (TND6396):
          - D-11 Reliability Methodology & Qualification: 03-defect/d11-reliability.md
          - D-12 SiC/SiO₂ Interface & Gate Oxide: 03-defect/d12-gate-oxide.md
          - D-13 BTI & Dynamic Stressing: 03-defect/d13-bti.md
          - D-14 Body Diode & BPD Management: 03-defect/d14-body-diode.md

  - Part IV. Process Control & AI Extension:
      - Overview: 04-control-ai/index.md
      - Photo Process:
          - FEOL/BEOL Photolithography: 04-control-ai/photo-feol-beol.md
          - OPC Mask Design: 04-control-ai/photo-opc.md
          - ASML/Nikon Tool Matching: 04-control-ai/photo-tool-matching.md
      - FDC / SPC:
          - WECO Rule Design: 04-control-ai/fdc-weco-rules.md
          - FDC AI Anomaly Detection: 04-control-ai/fdc-ai-anomaly.md
          - GNN-based FDC: 04-control-ai/fdc-gnn.md
      - Machine Vision & AI:
          - Machine Vision (WCMP): 04-control-ai/ai-machine-vision.md
          - Defect Classification Model: 04-control-ai/ai-defect-classification.md
          - RCA Ontology (PCB → SiC): 04-control-ai/ai-rca-ontology.md

  - Part V. References:
      - Index: 05-references/index.md
      - TND6396 — Robust Reliability: 05-references/tnd6396.md
      - BRD8094 — Vertical Integration: 05-references/brd8094.md
      - Glossary: 05-references/glossary.md

# -----------------------------------------------------------
# 푸터 / 소셜
# -----------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/btjeon
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/%EB%B3%91%ED%83%81-%EC%A0%84-8871b8153/
      name: LinkedIn
