# ===========================================================
# SiC 반도체 위키 - MkDocs 설정
# 작성자: Byoungtak Jeon (전병탁)
# ===========================================================

site_name: SiC 반도체 위키
site_description: SiC(Silicon Carbide) 반도체 소자·공정·FDC·AI 응용 정리
site_author: Byoungtak Jeon
site_url: https://btjeon.github.io/sic-wiki/

# GitHub 저장소 — 실제 repo 주소로 변경
repo_name: btjeon/sic-wiki
repo_url: https://github.com/btjeon/sic-wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Byoungtak Jeon

# -----------------------------------------------------------
# 테마: Material for MkDocs
# -----------------------------------------------------------
theme:
  name: material
  language: ko
  features:
    - navigation.instant         # SPA 스타일 페이지 전환
    - navigation.tracking        # URL 자동 갱신
    - navigation.tabs            # 상단 탭
    - navigation.tabs.sticky
    - navigation.sections        # 좌측 섹션 그룹
    - navigation.expand          # 좌측 메뉴 펼침
    - navigation.indexes         # 섹션 index.md 지원
    - navigation.top             # 맨 위로 버튼
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy          # 코드 복사 버튼
    - content.code.annotate      # 코드 주석
    - content.tabs.link
    - content.action.edit        # GitHub edit 버튼
    - toc.follow
  palette:
    # 라이트 모드
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    # 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# -----------------------------------------------------------
# 추가 CSS / JS
# -----------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# -----------------------------------------------------------
# Markdown 확장
# -----------------------------------------------------------
markdown_extensions:
  # 기본 확장
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4

  # PyMdown 확장 (Material 권장)
  - pymdownx.arithmatex:           # LaTeX 수식
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

  # PlantUML (회로도/시퀀스 다이어그램)
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg

# -----------------------------------------------------------
# 플러그인
# -----------------------------------------------------------
plugins:
  - search:
      lang:
        - ko
        - en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true   # git 저장소가 아닐 때 빌드 날짜로 대체
  - awesome-pages

# -----------------------------------------------------------
# 좌측 내비게이션
# -----------------------------------------------------------
nav:
  - 홈: index.md
  - 소개: about.md

  - 📚 Part I. SiC Foundations:
      - 개요: 01-foundations/index.md
      - Ch.1 SiC 재료·결정 기초: 01-foundations/ch01-material.md
      - Ch.2 SiC 웨이퍼 & 에피택셜 성장: 01-foundations/ch02-wafer-epi.md
      - Ch.3 SiC 디바이스 구조: 01-foundations/ch03-device.md

  - ⚙️ Part II. Process & Manufacturing:
      - 개요: 02-process/index.md
      - Ch.4 SiC 공정 흐름 (FEOL→BEOL): 02-process/ch04-process-flow.md
      - Ch.5 onsemi SiC 사업·제품·BK Factory: 02-process/ch05-onsemi-bk.md
      - Ch.6 수직계열 통합 공급망 & EV 전략: 02-process/ch06-vertical-integration.md

  - 📕 Part III. SiC Defect Management:
      - 개요: 03-defect/index.md
      - A. 결함의 이해:
          - A-1 결함 분류 체계: 03-defect/a01-classification.md
          - A-2 SiC 표면 결함: 03-defect/a02-surface.md
          - A-3 Trench·Sub-CD 마이크로 결함: 03-defect/a03-trench-subcd.md
          - A-4 Killer/Slow-Killer RCA: 03-defect/a04-killer-rca.md
      - B. 검사 장비·AI·운영:
          - B-5 AOI 검사 장비 운영: 03-defect/b05-aoi.md
          - B-6 ADC (Auto Defect Classification): 03-defect/b06-adc.md
          - B-7 Klarity 운영: 03-defect/b07-klarity.md
      - C. 관리 체계·품질:
          - C-8 SPC 기반 결함 밀도 관리: 03-defect/c08-spc.md
          - C-9 VOG (Visual Outgoing Inspection): 03-defect/c09-vog.md
          - C-10 신규 공정 도입시 결함 관리: 03-defect/c10-new-process.md
      - D. 신뢰성 백서 (TND6396):
          - D-11 신뢰성 방법론 & Qualification: 03-defect/d11-reliability.md
          - D-12 SiC/SiO₂ 계면 & Gate Oxide: 03-defect/d12-gate-oxide.md
          - D-13 BTI & Dynamic Stressing: 03-defect/d13-bti.md
          - D-14 Body Diode & BPD Management: 03-defect/d14-body-diode.md

  - 🔧 Part IV. 공정 제어 & AI 확장:
      - 개요: 04-control-ai/index.md
      - Photo 공정:
          - FEOL/BEOL 포토리소그래피: 04-control-ai/photo-feol-beol.md
          - OPC 마스크 설계: 04-control-ai/photo-opc.md
          - ASML/Nikon Tool Matching: 04-control-ai/photo-tool-matching.md
      - FDC / SPC:
          - Weco Rule 설계: 04-control-ai/fdc-weco-rules.md
          - FDC AI 이상 감지 사례: 04-control-ai/fdc-ai-anomaly.md
          - GNN 기반 FDC: 04-control-ai/fdc-gnn.md
      - Machine Vision & AI:
          - 머신비전 적용 (WCMP): 04-control-ai/ai-machine-vision.md
          - 불량 분류 모델: 04-control-ai/ai-defect-classification.md
          - RCA Ontology (PCB→SiC): 04-control-ai/ai-rca-ontology.md

  - 📎 Part V. References:
      - 자료 색인: 05-references/index.md
      - 📄 TND6396 — Robust Reliability: 05-references/tnd6396.md
      - 📄 BRD8094 — Vertical Integration: 05-references/brd8094.md
      - 용어집 (Glossary): 05-references/glossary.md

# -----------------------------------------------------------
# 푸터 / 소셜
# -----------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/btjeon
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/%EB%B3%91%ED%83%81-%EC%A0%84-8871b8153/
      name: LinkedIn
