# ===========================================================
# SiC 반도체 위키 - MkDocs 설정 (v2)
# 작성자: Byoungtak Jeon (전병탁)
# 변경: nav 블록을 SiC 학습 노트 책 구조에 맞춰 재구성
# ===========================================================

site_name: SiC 반도체 위키
site_description: SiC(Silicon Carbide) 소자·공정·결함관리·신뢰성·AI 응용 학습 노트
site_author: Byoungtak Jeon
site_url: https://btjeon.github.io/sic-wiki/

repo_name: btjeon/sic-wiki
repo_url: https://github.com/btjeon/sic-wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Byoungtak Jeon

# -----------------------------------------------------------
# 테마: Material for MkDocs (기존 설정 유지)
# -----------------------------------------------------------
theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR

# -----------------------------------------------------------
# Navigation (Notion 미러)
# -----------------------------------------------------------
nav:
  - 홈: index.md
  - 소개: about.md

  - 📚 Part I. SiC Foundations:
      - 개요: 01-foundations/index.md
      - Ch.1 SiC 재료·결정 기초: 01-foundations/ch01-material.md
      - Ch.2 SiC 웨이퍼 & 에피택셜 성장: 01-foundations/ch02-wafer-epi.md
      - Ch.3 SiC 디바이스 구조: 01-foundations/ch03-device.md

  - ⚙️ Part II. Process & Manufacturing:
      - 개요: 02-process/index.md
      - Ch.4 SiC 공정 흐름 (FEOL→BEOL): 02-process/ch04-process-flow.md
      - Ch.5 onsemi SiC 사업·제품·BK Factory: 02-process/ch05-onsemi-bk.md
      - Ch.6 수직계열 통합 공급망 & EV 전략: 02-process/ch06-vertical-integration.md

  - 📕 Part III. SiC Defect Management:
      - 개요: 03-defect/index.md
      - A. 결함의 이해:
          - A-1 결함 분류 체계: 03-defect/a01-classification.md
          - A-2 SiC 표면 결함: 03-defect/a02-surface.md
          - A-3 Trench·Sub-CD 마이크로 결함: 03-defect/a03-trench-subcd.md
          - A-4 Killer/Slow-Killer RCA: 03-defect/a04-killer-rca.md
      - B. 검사 장비·AI·운영:
          - B-5 AOI 검사 장비 운영: 03-defect/b05-aoi.md
          - B-6 ADC (Auto Defect Classification): 03-defect/b06-adc.md
          - B-7 Klarity 운영: 03-defect/b07-klarity.md
      - C. 관리 체계·품질:
          - C-8 SPC 기반 결함 밀도 관리: 03-defect/c08-spc.md
          - C-9 VOG (Visual Outgoing Inspection): 03-defect/c09-vog.md
          - C-10 신규 공정 도입시 결함 관리: 03-defect/c10-new-process.md
      - D. 신뢰성 백서 (TND6396):
          - D-11 신뢰성 방법론 & Qualification: 03-defect/d11-reliability.md
          - D-12 SiC/SiO₂ 계면 & Gate Oxide: 03-defect/d12-gate-oxide.md
          - D-13 BTI & Dynamic Stressing: 03-defect/d13-bti.md
          - D-14 Body Diode & BPD Management: 03-defect/d14-body-diode.md

  - 🔧 Part IV. 공정 제어 & AI 확장:
      - 개요: 04-control-ai/index.md
      - Photo 공정:
          - FEOL/BEOL 포토리소그래피: 04-control-ai/photo-feol-beol.md
          - OPC 마스크 설계: 04-control-ai/photo-opc.md
          - ASML/Nikon Tool Matching: 04-control-ai/photo-tool-matching.md
      - FDC / SPC:
          - Weco Rule 설계: 04-control-ai/fdc-weco-rules.md
          - FDC AI 이상 감지 사례: 04-control-ai/fdc-ai-anomaly.md
          - GNN 기반 FDC: 04-control-ai/fdc-gnn.md
      - Machine Vision & AI:
          - 머신비전 적용 (WCMP): 04-control-ai/ai-machine-vision.md
          - 불량 분류 모델: 04-control-ai/ai-defect-classification.md
          - RCA Ontology (PCB→SiC): 04-control-ai/ai-rca-ontology.md

  - 📎 Part V. References:
      - 자료 색인: 05-references/index.md
      - 📄 TND6396 — Robust Reliability: 05-references/tnd6396.md
      - 📄 BRD8094 — Vertical Integration: 05-references/brd8094.md
      - 용어집 (Glossary): 05-references/glossary.md

